spring.application.name=stockflow-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/stockflow_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=${JWT_SECRET:mySecretKeyForStockFlowApplicationJwtToken123456}
jwt.expiration=86400000

# Set to true only in non-production environments to include stack traces in error responses
app.include-stack-trace=false

# Comma-separated list of origins allowed for CORS
app.cors.allowed-origins=http://localhost:5173

